<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talent Signal · Login design study</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="#main"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 10.5c-4.3-2.1-9.2-2.8-14-1.6C12.1 11.8 5.7 24.2 9.9 35.6c3.8 10.2 14.8 15.8 25.2 12.9"/><path class="signal" d="M43.8 15.6c7.4 6.1 8.6 17 2.7 24.5"/></svg>Talent Signal</a><nav aria-label="设计预览"><a href="?direction=a">A · 延续</a><a href="?direction=b">B · 留白</a><button id="theme" aria-label="切换明暗主题">◐</button></nav></header>
<main id="main" class="stage"><aside class="continuity"><p class="kicker">让重要的连接，延续下去</p><h2>换个屏幕，<br>继续上次的对话。</h2><p class="story">联系人、会话和一路积累的上下文，<br>始终在你的同一账号里。</p><div class="continuity-map" aria-label="同一账号，在 iPhone、Web 和 Mac 继续"><div class="account-line"><span class="account-dot"></span><span>你的关系工作台</span></div><div class="devices"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10 18h4"/></svg>iPhone</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.1M10 6.5h.1"/></svg>Web</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="13" rx="1.5"/><path d="M12 16v5M8 21h8"/></svg>Mac</span></div></div><p class="quiet-note">从上次停下的地方，接着开始。</p></aside>
<section class="entry" aria-labelledby="login-title"><header class="heading"><p class="kicker">欢迎回来</p><h1 id="login-title">登录你的工作台</h1><p>重要的人与对话，都在这里。</p></header><div class="notice" id="notice" hidden role="alert"><strong>这个邮箱已有账号</strong><p>请先使用原来的方式登录，再到设置中绑定新的登录方式。联系人与会话会留在原账号里。</p></div><div class="providers"><button type="button" class="provider apple"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.3 12.9c0-2 1.6-3 1.7-3.1-1-1.5-2.5-1.7-3.1-1.7-1.3-.1-2.6.8-3.3.8-.7 0-1.8-.8-2.9-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.8 1.1 8.9.7 1 1.5 2.1 2.6 2.1 1-.1 1.4-.7 2.8-.7 1.3 0 1.7.7 2.9.7 1.2 0 1.9-1 2.6-2 .8-1.2 1.2-2.4 1.2-2.5-.1 0-2.3-.9-2.3-3.9zM15.1 6.6c.6-.8 1-1.8.9-2.8-.9.1-1.9.6-2.5 1.3-.6.7-1.1 1.7-1 2.7 1 .1 1.9-.5 2.6-1.2z" fill="currentColor"/></svg>使用 Apple 继续</button><button type="button" class="provider"><img src="google-sign-in.png" alt="" width="19" height="19">使用 Google 继续</button></div><div class="divider"><span>或使用邮箱</span></div><form id="form"><div class="field"><label for="email">邮箱或用户名</label><input id="email" name="identifier" autocomplete="username" inputmode="email" placeholder="you@example.com" required></div><div class="field"><label for="password">密码</label><div class="password"><input type="password" id="password" autocomplete="current-password" placeholder="输入密码" required><button type="button" id="reveal" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div><button class="submit" type="submit">登录 <span aria-hidden="true">→</span></button></form><p class="switch">第一次来？<button type="button" id="mode">创建账号</button></p><div class="sync-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7a8 8 0 0 0-13-2L4 8m0-5v5h5M4 17a8 8 0 0 0 13 2l3-3m0 5v-5h-5"/></svg><span>同一账号，联系人与会话自动同步。</span></div></section></main>
<footer><span>只带入你选择分享的内容。</span><button id="conflict" type="button">预览邮箱冲突</button><span>交互设计预览 · 不会提交登录</span></footer>
<script>
const params=new URLSearchParams(location.search);document.body.dataset.direction=params.get('direction')==='b'?'b':'a';document.body.dataset.theme=params.get('theme')==='dark'?'dark':'light';
document.querySelector('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark'};
document.querySelector('#reveal').onclick=e=>{const p=document.querySelector('#password'), b=e.currentTarget; p.type=p.type==='password'?'text':'password';b.setAttribute('aria-label',p.type==='text'?'隐藏密码':'显示密码');b.setAttribute('aria-pressed',p.type==='text'?'true':'false')};
document.querySelector('#conflict').onclick=()=>{const n=document.querySelector('#notice');n.hidden=!n.hidden};
document.querySelector('#form').onsubmit=e=>{e.preventDefault();document.querySelector('#notice').hidden=false};
document.querySelectorAll('.provider').forEach(b=>b.onclick=()=>{document.querySelector('#notice').hidden=false});
document.querySelector('#mode').onclick=e=>{const register=e.currentTarget.textContent==='创建账号';e.currentTarget.textContent=register?'返回登录':'创建账号';document.querySelector('#login-title').textContent=register?'从你开始。':'登录你的工作台';document.querySelector('.heading>p:last-child').textContent=register?'验证邮箱后，就能开始建立你的关系工作台。':'重要的人与对话，都在这里。';document.querySelector('.submit').firstChild.textContent=register?'创建账号 ':'登录 ';document.querySelector('#password').autocomplete=register?'new-password':'current-password';document.querySelector('#password').value=''};
</script></body></html>
