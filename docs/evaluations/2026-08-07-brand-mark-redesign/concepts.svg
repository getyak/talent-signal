<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <style>
      .bg { fill: #f2f0ea; }
      .paper { fill: #faf9f5; stroke: #d9d5ca; }
      .ink { color: #171715; }
      .vermilion { color: #c84a35; }
      .title { fill: #171715; font: 600 46px "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.5px; }
      .label { fill: #8b3529; font: 600 13px "Helvetica Neue", Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; }
      .body { fill: #605e57; font: 400 19px "Helvetica Neue", Arial, sans-serif; }
      .wordmark { fill: #171715; font: 650 30px "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.8px; }
      .wordmark-small { fill: #171715; font: 650 16px "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.35px; }
      .size { fill: #858179; font: 500 12px "SFMono-Regular", Menlo, monospace; letter-spacing: 1px; }
    </style>

    <symbol id="held-interval" viewBox="0 0 64 64">
      <path d="M38 10.5c-4.3-2.1-9.2-2.8-14-1.6C12.1 11.8 5.7 24.2 9.9 35.6c3.8 10.2 14.8 15.8 25.2 12.9"
        fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M43.8 15.6c7.4 6.1 8.6 17 2.7 24.5"
        fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="causal-frame" viewBox="0 0 64 64">
      <path d="M44.5 11.5H20c-5 0-8.5 3.6-8.5 8.5v24c0 5 3.5 8.5 8.5 8.5h14.5"
        fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M48.5 20v24c0 5-3.5 8.5-8.5 8.5"
        fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <text class="label" x="80" y="78">TALENT SIGNAL · BRAND DIRECTION STUDY</text>
  <text class="title" x="80" y="138">The relationship needs air. The change needs a trace.</text>
  <text class="body" x="80" y="178">Two mission-rooted symbols, tested from application icon to navigation scale.</text>

  <g transform="translate(80 230)">
    <rect class="paper" width="690" height="710" rx="28"/>
    <text class="label" x="42" y="54">A · HELD INTERVAL</text>
    <text class="title" x="42" y="110">Protect the space</text>
    <text class="body" x="42" y="145">A relationship held open; the vermilion signal never closes it.</text>

    <g transform="translate(42 188)">
      <rect width="300" height="300" rx="72" fill="#f4f1e9"/>
      <g transform="translate(77 77) scale(2.28)" class="ink">
        <path d="M38 10.5c-4.3-2.1-9.2-2.8-14-1.6C12.1 11.8 5.7 24.2 9.9 35.6c3.8 10.2 14.8 15.8 25.2 12.9"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(77 77) scale(2.28)" class="vermilion">
        <path d="M43.8 15.6c7.4 6.1 8.6 17 2.7 24.5"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <text class="size" x="0" y="326">1024 / APP FIELD</text>
    </g>

    <g transform="translate(400 200)">
      <g transform="scale(1.75)" class="ink">
        <path d="M38 10.5c-4.3-2.1-9.2-2.8-14-1.6C12.1 11.8 5.7 24.2 9.9 35.6c3.8 10.2 14.8 15.8 25.2 12.9"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <g transform="scale(1.75)" class="vermilion">
        <path d="M43.8 15.6c7.4 6.1 8.6 17 2.7 24.5"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <text class="size" x="0" y="140">128 / EXTENSION</text>
    </g>

    <g transform="translate(400 394)">
      <rect width="244" height="66" rx="17" fill="#f7f5ef" stroke="#dfdbd0"/>
      <g transform="translate(18 18) scale(.46)">
        <g class="ink">
          <path d="M38 10.5c-4.3-2.1-9.2-2.8-14-1.6C12.1 11.8 5.7 24.2 9.9 35.6c3.8 10.2 14.8 15.8 25.2 12.9"
            fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
        </g>
        <g class="vermilion">
          <path d="M43.8 15.6c7.4 6.1 8.6 17 2.7 24.5"
            fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
        </g>
      </g>
      <text class="wordmark-small" x="58" y="40">Talent Signal</text>
      <text class="size" x="0" y="92">28 / NAVIGATION</text>
    </g>

    <g transform="translate(42 566)">
      <text class="label" x="0" y="0">READ</text>
      <text class="body" x="0" y="36">More human and spacious.</text>
      <text class="body" x="0" y="66">Risk: a broken ring can feel generic.</text>
    </g>
  </g>

  <g transform="translate(830 230)">
    <rect class="paper" width="690" height="710" rx="28"/>
    <text class="label" x="42" y="54">B · CAUSAL FRAME</text>
    <text class="title" x="42" y="110">Show the seam</text>
    <text class="body" x="42" y="145">Evidence stays held; one review line makes consequence visible.</text>

    <g transform="translate(42 188)">
      <rect width="300" height="300" rx="72" fill="#f4f1e9"/>
      <g transform="translate(77 77) scale(2.28)" class="ink">
        <path d="M44.5 11.5H20c-5 0-8.5 3.6-8.5 8.5v24c0 5 3.5 8.5 8.5 8.5h14.5"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(77 77) scale(2.28)" class="vermilion">
        <path d="M48.5 20v24c0 5-3.5 8.5-8.5 8.5"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <text class="size" x="0" y="326">1024 / APP FIELD</text>
    </g>

    <g transform="translate(400 200)">
      <g transform="scale(1.75)" class="ink">
        <path d="M44.5 11.5H20c-5 0-8.5 3.6-8.5 8.5v24c0 5 3.5 8.5 8.5 8.5h14.5"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="scale(1.75)" class="vermilion">
        <path d="M48.5 20v24c0 5-3.5 8.5-8.5 8.5"
          fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <text class="size" x="0" y="140">128 / EXTENSION</text>
    </g>

    <g transform="translate(400 394)">
      <rect width="244" height="66" rx="17" fill="#f7f5ef" stroke="#dfdbd0"/>
      <g transform="translate(18 18) scale(.46)">
        <g class="ink">
          <path d="M44.5 11.5H20c-5 0-8.5 3.6-8.5 8.5v24c0 5 3.5 8.5 8.5 8.5h14.5"
            fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g class="vermilion">
          <path d="M48.5 20v24c0 5-3.5 8.5-8.5 8.5"
            fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
        </g>
      </g>
      <text class="wordmark-small" x="58" y="40">Talent Signal</text>
      <text class="size" x="0" y="92">28 / NAVIGATION</text>
    </g>

    <g transform="translate(42 566)">
      <text class="label" x="0" y="0">READ</text>
      <text class="body" x="0" y="36">More editorial and product-specific.</text>
      <text class="body" x="0" y="66">Risk: a closed frame can resemble a utility icon.</text>
    </g>
  </g>
</svg>
