<text fill="#34332f" font-family="Hiragino Sans GB, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="575" y="399">01  理解证据</tspan><tspan x="575" y="420.6">      OCR · 说话人 · 日期 · 原文片段</tspan><tspan x="575" y="442.2"></tspan><tspan x="575" y="463.8">02  匹配上下文</tspan><tspan x="575" y="485.4">      人物 · 职位 · 搜索项目 · 冲突</tspan><tspan x="575" y="507"></tspan><tspan x="575" y="528.6">03  拟定事实与行动</tspan><tspan x="575" y="550.2">      联系人 · 会议 · 跟进 · 不行动 / no_action</tspan></text>
