name: TalentSignal
options:
  bundleIdPrefix: com.talentsignal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6RG2F8YY59
    SWIFT_VERSION: 6.0
targets:
  TalentSignal:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/TalentSignal
    resources:
      - path: apps/ios/TalentSignal/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app
        PRODUCT_NAME: Talent Signal
        PRODUCT_MODULE_NAME: TalentSignal
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: apps/ios/TalentSignal/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - TalentSignalTests
  TalentSignalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: apps/ios/TalentSignalTests
    dependencies:
      - target: TalentSignal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app.tests
        GENERATE_INFOPLIST_FILE: YES
