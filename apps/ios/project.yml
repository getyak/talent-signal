name: TalentSignal

options:
  bundleIdPrefix: com.talentsignal
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 6RG2F8YY59
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.0

targets:
  TalentSignal:
    type: application
    platform: iOS
    entitlements:
      path: Resources/TalentSignal.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - TalentSignal.entitlements
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Talent Signal
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Talent Signal imports only the conversation screenshot you choose.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talent Signal records audio only after you confirm authorization and tap Start while the app is in the foreground.
        INFOPLIST_KEY_TalentSignalAPIBaseURL: $(TALENT_SIGNAL_API_BASE_URL)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app
        PRODUCT_NAME: TalentSignal
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "iPhone Distribution: Xiong Xinwei (6RG2F8YY59)"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.talentsignal.app
    scheme:
      gatherCoverageData: true
      testTargets:
        - TalentSignalTests
        - TalentSignalUITests

  TalentSignalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TalentSignal
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app.tests

  TalentSignalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - Info.plist
    dependencies:
      - target: TalentSignal
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: UITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app.uitests
        TEST_TARGET_NAME: TalentSignal
