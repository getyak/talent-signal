[package]
name = "talent-signal-macos-hybrid"
version = "0.1.0"
description = "Least-privilege Talent Signal macOS Hybrid feasibility shell"
authors = ["Talent Signal"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "talent_signal_macos_hybrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
keyring = "4.2.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-notification = "=2.4.0"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "3.23.0"
