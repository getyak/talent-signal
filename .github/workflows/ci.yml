name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios_test_scope:
        description: iOS UI coverage for an explicit diagnostic run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      regression_case_id:
        description: Optional saved Lab case UUID for authenticated CI consumption
        required: false
        type: string
      regression_run_id:
        description: Completed rerun UUID belonging to the selected Lab case
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select latest trusted TestFlight release
        id: testflight_release
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const { selectLatestTestFlightRelease } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/testflight-release-receipt.cjs`,
            );
            const latestRelease = selectLatestTestFlightRelease(releases);
            core.setOutput("tag", latestRelease?.tag_name ?? "");

      - name: Detect iOS-related changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LATEST_TESTFLIGHT_TAG: ${{ steps.testflight_release.outputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          comparison_base="$BASE_SHA"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            comparison_base=""
            if [ -n "$LATEST_TESTFLIGHT_TAG" ]; then
              comparison_base="$(git rev-parse "$LATEST_TESTFLIGHT_TAG^{commit}")"
              echo "Checking unreleased iOS changes since trusted receipt $LATEST_TESTFLIGHT_TAG"
            else
              echo "No trusted TestFlight release receipt; requiring iOS checks"
            fi
          fi

          ios="$(./scripts/ci/has-ios-changes.sh "$comparison_base" "$HEAD_SHA" --ci-files)"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "iOS checks required: $ios"

  repository:
    name: Repository policy and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js for repository checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify repository policy
        run: |
          ./scripts/ci/check-actions-pinned.sh
          ./scripts/ci/check-secrets.sh
          ./scripts/ci/test-next-ios-version.sh
          node --test scripts/verify-secret-environment.test.mjs scripts/infisical/manifest.test.mjs scripts/infisical/migrate.test.mjs scripts/infisical/run.test.mjs
          node --test scripts/ci/ios-release-policy.test.mjs
          node --test scripts/ios/*.test.mjs
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck scripts/ci/*.sh scripts/ios/*.sh

      - name: Install actionlint
        run: ./scripts/ci/install-actionlint.sh "$RUNNER_TEMP/bin"

      - name: Validate GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/bin/actionlint" -color

      - name: Verify required project documents
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f design.md
          test -f AGENTS.md
          test -f PLANS.md
          test -f REVIEW.md
          test -f docs/README.md
          test -f docs/product.md
          test -f docs/architecture.md
          test -f docs/agent-system.md
          test -f docs/documentation.md
          test -f docs/delivery.md
          test -f docs/operations/ci-cd.md
          node scripts/check-docs.mjs

      - name: Verify compiled wiki
        run: |
          node --test scripts/wiki.test.mjs
          node scripts/wiki.mjs check

      - name: Check external Markdown links (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: false
          jobSummary: true

  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Run candidate momentum Eval
        run: pnpm eval:core

      - name: Build
        env:
          # Enables production-mode route evaluation in CI only; deployments use
          # their separately managed AUTH_SECRET.
          AUTH_SECRET: ci-build-only-not-a-deployment-secret
        run: pnpm build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      lab-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lab-ci-only
          POSTGRES_DB: lab_regression_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab_regression_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, and build
        run: pnpm backend:ci

      - name: Verify Lab regression consumer boundaries
        run: |
          pnpm --filter @talent-signal/eval-runner typecheck
          pnpm --filter @talent-signal/eval-runner exec vitest run src/labRegression.test.ts

      - name: Verify screenshot contact authority with PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          CONTACT_AGENT_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
        run: |
          pnpm --filter @talent-signal/backend migrate
          pnpm --filter @talent-signal/backend seed
          pnpm --filter @talent-signal/backend exec vitest run src/modules/screenshotContactTasks.integration.test.ts

      - name: Exercise saved regression lifecycle with a synthetic provider
        env:
          DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          LAB_REGRESSION_EVALUATION_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          LAB_CI_EVALUATION_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          LAB_REGRESSION_PROOF_OUTPUT_DIR: ${{ github.workspace }}/build/lab-regression-inputs
        run: |
          pnpm --filter @talent-signal/backend migrate
          pnpm --filter @talent-signal/backend seed
          pnpm --filter @talent-signal/backend exec tsx src/evaluation/runLabRegressionEvaluation.ts
          pnpm --filter @talent-signal/backend exec tsx src/evaluation/runLabCIVerificationEvaluation.ts
          pnpm --filter @talent-signal/eval-runner exec tsx src/cli.ts lab-regression \
            --bundle "$LAB_REGRESSION_PROOF_OUTPUT_DIR/bundle.json" \
            --run "$LAB_REGRESSION_PROOF_OUTPUT_DIR/run.json" \
            --output "$GITHUB_WORKSPACE/build/lab-regression-report.json"

      - name: Preserve Lab regression fixture metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lab-regression-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/lab-regression-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Consume the selected Lab regression
        if: github.event_name == 'workflow_dispatch' && (inputs.regression_case_id != '' || inputs.regression_run_id != '')
        env:
          LAB_CASE_ID: ${{ inputs.regression_case_id }}
          LAB_RUN_ID: ${{ inputs.regression_run_id }}
          LAB_BACKEND_ORIGIN: ${{ vars.LAB_BACKEND_ORIGIN }}
          TS_LAB_EVALUATION_TOKEN: ${{ secrets.LAB_EVALUATION_SESSION_TOKEN }}
        run: |
          test -n "$LAB_CASE_ID"
          test -n "$LAB_RUN_ID"
          test -n "$LAB_BACKEND_ORIGIN"
          test -n "$TS_LAB_EVALUATION_TOKEN"
          pnpm --filter @talent-signal/eval-runner exec tsx src/cli.ts lab-regression \
            --backend "$LAB_BACKEND_ORIGIN" --regression-id "$LAB_CASE_ID" --run-id "$LAB_RUN_ID" \
            --output "$GITHUB_WORKSPACE/build/lab-selected-regression/lab-regression-report.json"

      - name: Preserve selected Lab regression consumption metadata
        if: always() && github.event_name == 'workflow_dispatch' && inputs.regression_case_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lab-regression-consumption-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/lab-selected-regression/lab-regression-report.json
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS release smoke
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and test iOS
        env:
          IOS_UI_TEST_SCOPE: ${{ inputs.ios_test_scope || 'smoke' }}
          RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/ios/TestResults.xcresult
        run: ./scripts/ios/check.sh

      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-test-results-${{ github.run_id }}
          path: build/ios/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI required
    needs: [changes, repository, web, backend, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      WEB_RESULT: ${{ needs.web.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      IOS_RESULT: ${{ needs.ios.result }}
    steps:
      - name: Enforce required job results
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$REPOSITORY_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$IOS_RESULT" = "success" || test "$IOS_RESULT" = "skipped"
