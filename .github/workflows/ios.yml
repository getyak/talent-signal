name: iOS

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "fastlane/**"
      - "scripts/ios/**"
      - "Gemfile*"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "fastlane/**"
      - "scripts/ios/**"
      - "Gemfile*"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the verified build to TestFlight"
        required: true
        default: true
        type: boolean
      version_override:
        description: "Override version (for example 0.1.2). Leave empty to auto-bump patch."
        required: false
        type: string

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and test iOS
        run: ./scripts/ios/check.sh

  testflight:
    name: Upload to TestFlight
    needs: checks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.upload_testflight)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override || '' }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          tag_exists() {
            local tag="$1"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1 ||
              git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          }

          if [ -n "$VERSION_OVERRIDE" ]; then
            if [[ ! "$VERSION_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version_override must use semantic version format such as 0.1.2"
              exit 1
            fi
            next_version="$VERSION_OVERRIDE"
            release_tag="v$next_version"
            if tag_exists "$release_tag"; then
              echo "::error::Tag $release_tag already exists"
              exit 1
            fi
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [ -n "$latest_tag" ]; then
              base_version="${latest_tag#v}"
            else
              base_version="$(
                sed -n -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/p' \
                  apps/ios/TalentSignal.xcodeproj/project.pbxproj |
                  head -n 1 |
                  tr -d ' '
              )"
            fi

            if [[ "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
            elif [[ "$base_version" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch=0
            else
              echo "::error::Unable to derive a semantic version from '$base_version'"
              exit 1
            fi

            for offset in $(seq 1 50); do
              next_version="$major.$minor.$((patch + offset))"
              release_tag="v$next_version"
              if ! tag_exists "$release_tag"; then
                break
              fi
              unset next_version release_tag
            done

            if [ -z "${next_version:-}" ]; then
              echo "::error::Unable to find an unused patch version after 50 attempts"
              exit 1
            fi
          fi

          echo "Release version: $next_version"
          echo "Release tag: $release_tag"
          echo "release_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure certificate repository access
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/match-ssh"
          printf '%s\n' "$MATCH_DEPLOY_KEY" > "$RUNNER_TEMP/match-ssh/key"
          chmod 600 "$RUNNER_TEMP/match-ssh/key"

      - name: Write App Store Connect API key
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/asc_key.p8"

      - name: Archive and upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios beta

      - name: Tag successful TestFlight release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 ||
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG was created by another release while this build was running"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Preserve IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TalentSignal-${{ github.run_number }}
          path: build/ios/TalentSignal.ipa
          retention-days: 14
