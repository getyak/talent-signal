name: Release iOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_testflight:
        description: Publish a verified build to TestFlight
        required: true
        default: false
        type: boolean
      version_override:
        description: Optional semantic version, for example 0.2.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether to release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.decision.outputs.release_sha }}
      should_release: ${{ steps.decision.outputs.should_release }}
    steps:
      - name: Evaluate release policy
        id: decision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_TESTFLIGHT: ${{ inputs.publish_testflight || false }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: repository.data.default_branch,
            });
            const releaseSha = branch.data.commit.sha;
            let shouldRelease = false;

            if (process.env.EVENT_NAME === "workflow_dispatch") {
              shouldRelease = process.env.PUBLISH_TESTFLIGHT === "true";
            } else if (process.env.VERIFIED_SHA !== releaseSha) {
              core.notice(
                "The verified CI revision is no longer the current default-branch tip; a newer CI run will decide its release.",
              );
            } else {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });
              const latestRelease = releases.find(
                ({ draft, tag_name: tagName }) =>
                  !draft && /^v\d+\.\d+\.\d+$/.test(tagName),
              );

              if (!latestRelease) {
                core.notice("No previous semantic TestFlight release was found.");
                shouldRelease = true;
              } else {
                core.info(
                  `Checking iOS changes since ${latestRelease.tag_name}`,
                );
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${latestRelease.tag_name}...${releaseSha}`,
                  per_page: 100,
                });
                const files = comparison.data.files ?? [];
                const exactReleaseFiles = new Set([
                  "Gemfile",
                  "Gemfile.lock",
                  ".github/workflows/release-ios.yml",
                  "scripts/ci/has-ios-changes.sh",
                  "scripts/ci/next-ios-version.sh",
                ]);
                const releasePrefixes = ["apps/ios/", "fastlane/", "scripts/ios/"];
                shouldRelease =
                  files.length >= 300 ||
                  files.some(
                    ({ filename }) =>
                      exactReleaseFiles.has(filename) ||
                      releasePrefixes.some((prefix) => filename.startsWith(prefix)),
                  );
              }
            }

            core.setOutput("release_sha", releaseSha);
            core.setOutput("should_release", shouldRelease ? "true" : "false");
            core.info(`TestFlight release required: ${shouldRelease}`);

  testflight:
    name: Publish TestFlight
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Require the release-scoped Infisical identity
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID == ''
        run: |
          echo "::error::INFISICAL_TESTFLIGHT_IDENTITY_ID is required for TestFlight releases"
          exit 1

      - name: Load release secrets from Infisical
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID != ''
        uses: Infisical/secrets-action@03d3fa38607956c493f53c6633f94006a13c47ae # v1.0.7
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_TESTFLIGHT_IDENTITY_ID }}
          oidc-audience: infisical://talent-signal/testflight
          project-slug: talent-signal-8p1-x
          env-slug: staging
          secret-path: /release

      - name: Validate release secrets
        run: |
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            DEVELOPMENT_TEAM \
            MATCH_DEPLOY_KEY \
            MATCH_GIT_URL \
            MATCH_KEYCHAIN_PASSWORD \
            MATCH_PASSWORD \
            TALENT_SIGNAL_API_BASE_URL \
            TS_OAUTH_CLIENT_ID \
            TS_OAUTH_SECRET; do
            delimiter="TS_SECRET_${GITHUB_RUN_ID}_${RANDOM}"
            printf '%s<<%s\n%s\n%s\n' \
              "$name" "$delimiter" "${!name:-}" "$delimiter" >> "$GITHUB_ENV"
          done

      - name: Validate release secrets
        run: |
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            DEVELOPMENT_TEAM \
            MATCH_DEPLOY_KEY \
            MATCH_GIT_URL \
            MATCH_KEYCHAIN_PASSWORD \
            MATCH_PASSWORD \
            TS_OAUTH_CLIENT_ID \
            TS_OAUTH_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js for iOS configuration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Connect ephemeral runner to the TestFlight tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure and verify iOS API
        run: |
          node scripts/ios/configure-build-environment.mjs --configuration Release
          api_hostname="$(node -e 'process.stdout.write(new URL(process.env.TALENT_SIGNAL_API_BASE_URL).hostname)')"
          tailscale ping --c 3 --timeout 10s --until-direct=false "$api_hostname"
          for attempt in 1 2 3; do
            if node scripts/ios/probe-auth-backend.mjs; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::The iOS authentication backend failed three bounded probes."
              exit 1
            fi
            echo "::notice::Retrying the end-to-end iOS API probe after a transient tailnet failure."
            sleep "$((attempt * 5))"
          done

      - name: Compute release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override || '' }}
        run: ./scripts/ci/next-ios-version.sh "$VERSION_OVERRIDE"

      - name: Prepare TestFlight release notes
        id: release_notes
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          notes="$RUNNER_TEMP/testflight-release-notes.txt"
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          if [ -n "$previous_tag" ]; then
            git log "$previous_tag..$RELEASE_SHA" --format='- %s' > "$notes"
          else
            git log -n 20 "$RELEASE_SHA" --format='- %s' > "$notes"
          fi

          if [ ! -s "$notes" ]; then
            printf '%s\n' '- Internal TestFlight update' > "$notes"
          fi

          python3 - "$notes" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          path.write_text(path.read_text()[:3800])
          PY
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure signing material
        id: release_metadata
        env:
          API_KEY_CONTENT: ${{ env.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/match-ssh"
          printf '%s\n' "$MATCH_DEPLOY_KEY" > "$RUNNER_TEMP/match-ssh/key"
          chmod 600 "$RUNNER_TEMP/match-ssh/key"
          printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"
          build_number="$(date -u +%Y%m%d%H%M%S)"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Verify isolated signing repository access
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: git ls-remote --exit-code "$MATCH_GIT_URL" HEAD

      - name: Archive and process TestFlight build
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
          RELEASE_CHANGELOG_PATH: ${{ steps.release_notes.outputs.path }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios beta

      - name: Attest IPA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/ios/TalentSignal.ipa

      - name: Tag successful TestFlight release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 ||
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG was created while this build was running"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            build/ios/TalentSignal.ipa \
            --generate-notes \
            --prerelease \
            --title "$RELEASE_TAG" \
            --verify-tag

      - name: Preserve IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TalentSignal-${{ steps.version.outputs.release_version }}
          path: build/ios/TalentSignal.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Summarize internal release
        env:
          BUILD_NUMBER: ${{ steps.release_metadata.outputs.build_number }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          {
            echo "### TestFlight release processed"
            echo ""
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Build: \`$BUILD_NUMBER\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- App Store Connect: https://appstoreconnect.apple.com/apps"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_key.p8"
          rm -f "$RUNNER_TEMP/match-ssh/key"
