version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    labels: [dependencies, area:ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    # Evaluation snapshots are immutable evidence, not maintained applications.
    exclude-paths:
      - "docs/evaluations/2026-09-01-momentum-experience-v2-direction/prototype-snapshot/**"
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 10
    labels: [dependencies, area:web]
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    labels: [dependencies, area:ios]
    groups:
      fastlane-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
