area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/ci/**"

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

area:ios:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/ios/**"
          - "fastlane/**"
          - "scripts/ios/**"
          - "Gemfile*"

area:web:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"

security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/security.yml"
          - "SECURITY.md"
          - "scripts/ci/check-secrets.sh"
