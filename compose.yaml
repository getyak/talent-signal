name: talent-signal-backend

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talent_signal_local}
      POSTGRES_USER: ${POSTGRES_USER:-talent_signal_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talent_signal_local_only}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - talent_signal_postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  migrate:
    image: talent-signal-backend-local:dev
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talent_signal_local}:${POSTGRES_PASSWORD:-talent_signal_local_only}@postgres:5432/${POSTGRES_DB:-talent_signal_local}
      NODE_ENV: development
      SIMULATED_AUTH_ENABLED: "true"
    command: ["node", "apps/backend/dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: "no"

  seed:
    image: talent-signal-backend-local:dev
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talent_signal_local}:${POSTGRES_PASSWORD:-talent_signal_local_only}@postgres:5432/${POSTGRES_DB:-talent_signal_local}
      NODE_ENV: development
      SIMULATED_AUTH_ENABLED: "true"
    command: ["node", "apps/backend/dist/database/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: talent-signal-backend-local:dev
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talent_signal_local}:${POSTGRES_PASSWORD:-talent_signal_local_only}@postgres:5432/${POSTGRES_DB:-talent_signal_local}
      NODE_ENV: development
      SIMULATED_AUTH_ENABLED: "true"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      PORT: "4317"
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    init: true
    ports:
      - "${BACKEND_PORT:-4317}:4317"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  talent_signal_postgres:
